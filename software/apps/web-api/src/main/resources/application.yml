spring:
  application:
    name: totah-lab-web-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/totah_lab_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        # Remaps the "public" schema of targets/pipeline_runs when the
        # totah.hibernate.public-schema system property is set (tests).
        physical-strategy: totah.lab.web.persistence.SchemaRemappingPhysicalNamingStrategy
    properties:
      hibernate:
        default_schema: docking

server:
  port: ${PORT:8080}

totah:
  artifacts:
    root: ${TOTAH_ARTIFACT_ROOT:${TOTAH_LAB_ROOT:${user.dir}/../../..}/resources/shared-resources/src/main/resources}
    external-root: ${TOTAH_ARTIFACTS_EXTERNAL_ROOT:${user.home}/artifacts}
  # Query-specific key residues by UniProt accession. Presentation
  # only; never affects alignment, correspondence, or scoring.
  key-residues:
    Q6UX53: LEU145,CYS148,HIS175,GLY199,ASP200,GLY201,CYS202,CYS203

pocket:
  search:
    # Production global-shape Stage 1 channel.
    global-shape:
      enabled: true
      limit: 500
    # Injects the receptor's chosen pockets as guaranteed-evaluation
    # candidates (no score or rank bonus, never auto-positive).
    include-chosen-references: true
