name: Build TSL-RSH Stage-A control wrapper

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ysuleiman/totah-lab-tsl-rsh-stage-a-control
  PACKAGE: analysis/mettl7-phase2/tsl-rsh-2d-torsion-completion/TSL_RSH_PHIPSI_2D_GPU_PACKAGE.zip
  PACKAGE_SHA256: 10012b2d6366781fd53f536fd3cf565f9fade1e3e293596966c3a08ac5b2b826

jobs:
  build-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify qualified package
        run: echo "${PACKAGE_SHA256}  ${PACKAGE}" | sha256sum --check --strict
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64 wrapper
        run: |
          docker buildx build --platform linux/amd64 --push \
            --file analysis/mettl7-phase2/tsl-rsh-2d-torsion-completion/Dockerfile.stage-a-control \
            --tag "${IMAGE}:${GITHUB_SHA}" .
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
          test -n "$DIGEST"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > IMAGE_DIGEST.txt
          printf 'SOURCE_COMMIT=%s\nPACKAGE_SHA256=%s\nSCIENTIFIC_PARENT=%s\n' \
            "$GITHUB_SHA" "$PACKAGE_SHA256" 'sha256:3644dfc04abfc9d1f9fe8653de165ffc196fbf6a5d8cb85b4ed10e1f50542ce8' > BUILD_RECEIPT.txt
          cat IMAGE_DIGEST.txt >> BUILD_RECEIPT.txt
      - name: Verify immutable anonymous pull
        run: |
          docker logout ghcr.io
          docker manifest inspect "$(cat IMAGE_DIGEST.txt)" > anonymous-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage-a-control-wrapper-${{ github.sha }}
          path: |
            IMAGE_DIGEST.txt
            BUILD_RECEIPT.txt
            anonymous-manifest.json
          retention-days: 90
